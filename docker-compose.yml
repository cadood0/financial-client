services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        # Where Next.js proxies /api/v1/* in production.
        # Same Docker network as the API: http://api:8080
        # API on the VPS host: http://host.docker.internal:8080
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8080}
    image: financial-client:latest
    container_name: financial-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    extra_hosts:
      # Lets the container reach services published on the VPS host (Linux Docker).
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
